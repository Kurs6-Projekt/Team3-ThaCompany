apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-website
spec:
  # En enda nod och hostPort 80 tillåter inte två poddar samtidigt.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: company-website
  template:
    metadata:
      labels:
        app: company-website
    spec:
      containers:
      - name: web
        image: ${DEPLOY_IMAGE}
        imagePullPolicy: Always
        ports:
        - containerPort: 7000
          hostPort: 80
        env:
        - name: FLASK_DEBUG
          value: "false"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 7000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 7000
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: company-website-data
