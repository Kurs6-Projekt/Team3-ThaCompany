apiVersion: batch/v1
kind: CronJob
metadata:
  name: sbom-vulnerability-scanner
  namespace: security-tools
spec:
  schedule: "0 12 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: sbom-scanner-sa
          restartPolicy: OnFailure
          volumes:
          - name: trivyignore
            configMap:
              name: sbom-scanner-trivyignore
          containers:
          - name: scanner
            image: alpine:3.24
            volumeMounts:
            - name: trivyignore
              mountPath: /etc/trivy/.trivyignore.yaml
              subPath: .trivyignore.yaml
              readOnly: true
            env:
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: sbom-vulnerability-scanner-secrets
                  key: discord-webhook-url
            # --- Team Configurable Variables ---
            - name: TARGET_NAMESPACE
              value: "default"
            - name: LABEL_SELECTOR
              value: "app=company-website"
            - name: FALLBACK_IMAGE
              value: "ghcr.io/kurs6-projekt/team3-thacompany:latest"
            - name: TRIVY_VERSION
              value: "0.75.0"
            # ------------------------------------
            command:
            - /bin/sh
            - -c
            - |
              set -eu
              set -o pipefail
              
              # Install dependencies
              apk add --no-cache curl jq cosign
              
              # Install the explicitly pinned Trivy release.
              curl -fsSL "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" \
                | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
              
              # Query Kubernetes API using environment variables
              APISERVER="https://kubernetes.default.svc"
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CA_CERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              
              echo "[*] Inspecting namespace '${TARGET_NAMESPACE}' for label '${LABEL_SELECTOR}'..."
              POD_JSON=$(curl -fsS --cacert "$CA_CERT" -H "Authorization: Bearer $TOKEN" \
                "$APISERVER/api/v1/namespaces/${TARGET_NAMESPACE}/pods?labelSelector=${LABEL_SELECTOR}")
              echo "$POD_JSON" | jq -e '.items | type == "array"' > /dev/null
                
              IMAGE_ID=$(echo "$POD_JSON" | jq -r '.items[0].status.containerStatuses[0].imageID // empty')
              
              if [ -n "$IMAGE_ID" ]; then
                IMAGE=$(echo "$IMAGE_ID" | sed 's|^.*://||')
                echo "[+] Target acquired from running pod (Digest): $IMAGE"
              else
                echo "[!] Warning: No active pod found. Falling back to: ${FALLBACK_IMAGE}"
                IMAGE="${FALLBACK_IMAGE}"
              fi
              
              # Verify the GitHub OIDC identity before trusting the SBOM.
              cosign verify-attestation \
                --type cyclonedx \
                --certificate-identity-regexp '^https://github\.com/Kurs6-Projekt/Team3-ThaCompany/\.github/workflows/deploy\.yml@refs/heads/main$' \
                --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
                "$IMAGE" > /tmp/verified-attestations.json
              jq -er '.payload' /tmp/verified-attestations.json \
                | base64 -d \
                | jq -e '.predicate' > /tmp/sbom.json
              test -s /tmp/sbom.json
              
              # Keep a complete inventory, but alert only on findings that have
              # not been explicitly accepted with a time-limited exception.
              trivy sbom /tmp/sbom.json --format json -o /tmp/trivy-report-all.json
              trivy sbom /tmp/sbom.json --ignorefile /etc/trivy/.trivyignore.yaml \
                --format json -o /tmp/trivy-report.json
              
              # Count High/Critical issues
              HIGH_CRIT_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' /tmp/trivy-report.json)
              if [ -z "$HIGH_CRIT_COUNT" ]; then HIGH_CRIT_COUNT=0; fi
              ALL_HIGH_CRIT_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' /tmp/trivy-report-all.json)
              SUPPRESSED_COUNT=$((ALL_HIGH_CRIT_COUNT - HIGH_CRIT_COUNT))
              
              # Route to Discord based on findings
              if [ "$HIGH_CRIT_COUNT" -eq 0 ]; then
                PAYLOAD='{"embeds": [{
                  "title": "🟢 Supply Chain Scan: All Clear", 
                  "description": "No unaccepted High or Critical vulnerabilities were detected in running workload:\n`'${IMAGE}'`.\nReviewed, time-limited exceptions: **'${SUPPRESSED_COUNT}'** findings.",
                  "color": 3066993, 
                  "footer": {"text": "k3s Trivy CronJob • Automated Lab Check"}
                }]}'
                curl -fsS -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL"
              else
                trivy sbom /tmp/sbom.json --ignorefile /etc/trivy/.trivyignore.yaml \
                  --severity HIGH,CRITICAL > /tmp/trivy-report.txt
                PAYLOAD_JSON='{"embeds": [{
                  "title": "🚨 Supply Chain Alert: Vulnerabilities Found", 
                  "description": "Found **'${HIGH_CRIT_COUNT}'** unaccepted High/Critical vulnerabilities in running workload:\n`'${IMAGE}'`.\nReviewed exceptions: **'${SUPPRESSED_COUNT}'** findings. See attached report for details.",
                  "color": 15158332, 
                  "footer": {"text": "k3s Trivy CronJob • Automated Lab Check"}
                }]}'
                curl -fsS -X POST -F "payload_json=$PAYLOAD_JSON" -F "file=@/tmp/trivy-report.txt" "$WEBHOOK_URL"
              fi
