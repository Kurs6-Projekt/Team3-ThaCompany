apiVersion: v1
kind: ServiceAccount
metadata:
  name: sbom-scanner-sa
  namespace: security-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sbom-scanner-pod-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sbom-scanner-pod-reader-binding
subjects:
- kind: ServiceAccount
  name: sbom-scanner-sa
  namespace: security-tools
roleRef:
  kind: ClusterRole
  name: sbom-scanner-pod-reader
  apiGroup: rbac.authorization.k8s.io
