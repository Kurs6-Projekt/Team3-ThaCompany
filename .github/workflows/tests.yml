name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Build and smoke-test runtime image
        run: |
          docker build --pull -t company-test .
          docker run -d --name company-test -e SECRET_KEY=ci-only-test-key -p 127.0.0.1:7000:7000 company-test
          trap 'docker logs company-test; docker rm -f company-test' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:7000/healthz
