{% extends 'base.html' %}

{% block title %}Login - Placeholder Industries{% endblock %}

{% block content %}
<div class="card">
    {% if user %}
        <h1 class="card-header">Welcome</h1>
        <div class="text-center">
            <p>Logged in as <strong>{{ user.username }}</strong></p>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-block mt-2">Continue</a>
        </div>
    {% else %}
        <h1 class="card-header">Log In</h1>
        <form method="post">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-input" type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Login</button>
        </form>
    {% endif %}
</div>
{% endblock %}
