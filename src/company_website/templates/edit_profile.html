{% extends 'base.html' %}

{% block title %}Edit Profile - {{ user.first_name }} {{ user.last_name }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 100%;">
    <h1 class="card-header" style="text-align: left;">Edit Profile</h1>
    <p>Editing profile for <strong>{{ user.first_name }} {{ user.last_name }}</strong> ({{ user.username }})</p>

    <form method="POST" action="{{ url_for('main.edit_profile', id=user.id) }}">
        <div class="form-group">
            <label class="form-label" for="first_name">First Name</label>
            <input class="form-input" type="text" id="first_name" name="first_name" value="{{ user.first_name or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label" for="last_name">Last Name</label>
            <input class="form-input" type="text" id="last_name" name="last_name" value="{{ user.last_name or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" value="{{ user.email or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label" for="role">Role</label>
            <input class="form-input" type="text" id="role" name="role" value="{{ user.role or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label" for="about">About</label>
            <textarea class="form-input" id="about" name="about" rows="5">{{ user.about or '' }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label" for="internal_notes">Internal Notes</label>
            <textarea class="form-input" id="internal_notes" name="internal_notes" rows="5">{{ user.internal_notes or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
    </form>
</div>
{% endblock %}
